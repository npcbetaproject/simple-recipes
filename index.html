<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simple Recipes — everyday recipes, kept simple.">
  <title>Simple Recipes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf7f0; color: #263c32; font-family: system-ui, sans-serif; }
    main { max-width: 720px; margin: 12vh auto; padding: 32px 24px; }
    .label { color: #766344; font-size: .8rem; letter-spacing: .15em; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: clamp(2.5rem, 9vw, 4.5rem); line-height: 1.05; margin: 20px 0; }
    p { font-size: 1.15rem; line-height: 1.7; }
    .notice { margin-top: 40px; padding: 24px; border: 1px solid #d8d2c4; border-radius: 12px; background: #fffdf8; }
  </style>
</head>
<body>
  <main>
    <div class="label">Everyday cooking</div>
    <h1>Simple Recipes</h1>
    <p>Everyday recipes, kept simple.</p>
    <section class="notice" aria-label="Site status">
      <p>Our recipe collection is coming soon.</p>
    </section>
  </main>
</body>
</html>
